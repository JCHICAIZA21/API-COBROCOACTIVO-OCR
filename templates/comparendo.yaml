# Plantilla PROVISIONAL de un comparendo / resolución de cobro coactivo.
# Se ajustará con los PDFs de muestra (ticket 04 → ticket 12).
# Los nombres de campo coinciden con las llaves de `expected` en la solicitud.
id: comparendo
version: "0.1.0"
description: Comparendo de tránsito / resolución de cobro coactivo (Colombia)
fields:
  - name: nro_comparendo
    kind: id_number
    key: true
    description: Número del comparendo (orden de comparendo), solo dígitos.
    patterns:
      - '(?:orden\s+de\s+)?comparendo\s*(?:n[o°º.]*|n[uú]mero)?\s*[:#]?\s*(?P<value>\d[\d\s.-]{4,30}\d)'
  - name: identificacion
    kind: id_number
    key: true
    description: Número de identificación (cédula o NIT) del infractor, solo dígitos.
    patterns:
      - '(?:c\.?\s*c\.?|c[eé]dula(?:\s+de\s+ciudadan[ií]a)?|identificaci[oó]n|documento|nit)\s*(?:n[o°º.]*|n[uú]mero)?\s*[:#]?\s*(?P<value>\d[\d.,\s-]{3,18}\d)'
  - name: fecha
    kind: date
    key: true
    description: Fecha del comparendo (fecha de imposición).
    patterns:
      - 'fecha(?:\s+del?\s+comparendo|\s+de\s+imposici[oó]n)?\s*[:]?\s*(?P<value>\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{2}-\d{2})'
  - name: placa
    kind: plate
    required: false
    description: Placa del vehículo.
    patterns:
      - 'placa\s*[:#]?\s*(?P<value>[A-Z]{3}\s?-?\s?\d{2,3}[A-Z]?)'
  - name: valor
    kind: money
    required: false
    description: Valor de la multa en pesos colombianos.
    patterns:
      - 'valor(?:\s+de\s+la\s+multa|\s+total)?\s*[:]?\s*\$?\s*(?P<value>\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{2})?|\d+)'
