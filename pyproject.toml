[project]
name = "docreader"
version = "0.1.0"
description = "Lectura y validación de campos en PDFs (texto nativo, OCR e IA): núcleo reutilizable + servicio API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pypdfium2>=5.15.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
claude = [
    "anthropic>=2.10.0",
]
openai = [
    "openai>=3.55.1",
]
api = [
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "python-multipart>=0.0.34",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docreader", "src/docreader_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: needs external services or system binaries (docker, tesseract, postgres, redis)",
  "live: calls paid external APIs (needs API keys)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "reportlab>=5.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]
